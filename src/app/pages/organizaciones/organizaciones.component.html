<app-header></app-header>
<div class="organization-container">

  <div class="organization-card">

    @if (cargando) {
      <p>Cargando...</p>
    } @else if (error) {
      <p class="error-message">{{ error }}</p>
    } @else if (organizacion) {

      <h1>{{ organizacion.nombre }}</h1>
      <p>Sector: {{ organizacion.sector }}</p>

      <p>Vas a iniciar una nueva evaluación de madurez para esta organización.</p>

      <button type="button" (click)="IniciarEvaluacion()" [disabled]="iniciando">
        {{ iniciando ? 'Iniciando...' : 'Comenzar evaluación' }}
      </button>

    }

  </div>

</div>
