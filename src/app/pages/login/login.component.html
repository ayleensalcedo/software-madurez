<div class="login-container">

  <!-- =====================================================
       LADO IZQUIERDO
       ===================================================== -->

  <div class="login-sidebar">

    <div class="sidebar-content">
      <h2></h2>
    </div>

  </div>


  <!-- =====================================================
       LADO DERECHO
       ===================================================== -->

  <div class="login-card">


    <!-- LOGO -->

    <div class="logo-container">

      <img
        src="https://cdn-icons-png.flaticon.com/512/284/284045.png"
        alt="Logo AI Secure Maturity"
        class="software-logo"
      >

    </div>


    <!-- TÍTULO -->

    <div class="login-header">
      <h1>AI - Secure Maturity</h1>
    </div>


    <!-- =================================================
         FORMULARIO
         ================================================= -->

    <form (ngSubmit)="iniciarSesion()">


      <!-- USUARIO -->

      <div class="form-group">

        <label for="usuario">
          Usuario
        </label>

        <input
          id="usuario"
          name="usuario"
          type="text"
          [(ngModel)]="email"
          placeholder="Ingrese su usuario"
          autocomplete="username"
          required
        >

      </div>


      <!-- CONTRASEÑA -->

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
          autocomplete="current-password"
          required
        >

      </div>


      <!-- MENSAJE DE ERROR -->

      @if (error) {

        <div class="login-error">
          {{ error }}
        </div>

      }


      <!-- BOTÓN -->

      <button
        type="submit"
        class="login-button"
      >
        Iniciar sesión
      </button>


    </form>

  </div>

</div>
