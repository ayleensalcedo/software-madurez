<div class="login-container">

  <!-- =====================================================
       LADO IZQUIERDO
       ===================================================== -->

  <div class="login-sidebar">

    <div class="sidebar-content">
      <h2></h2>
    </div>

  </div>


  <!-- =====================================================
       LADO DERECHO
       ===================================================== -->

  <div class="login-card">


    <!-- LOGO -->

    <div class="logo-container">

      <img
        src="https://cdn-icons-png.flaticon.com/512/284/284045.png"
        alt="Logo AI Secure Maturity"
        class="software-logo"
      >

    </div>


    <!-- TÍTULO -->

    <div class="login-header">
      <h1>AI - Secure Maturity</h1>
    </div>


    <!-- =================================================
         FORMULARIO
         ================================================= -->

    <form (ngSubmit)="iniciarSesion()">


      <!-- USUARIO -->

      <div class="form-group">

        <label for="usuario">
          Correo electrónico
        </label>

        <input
          id="usuario"
          name="usuario"
          type="text"
          [(ngModel)]="email"
          placeholder="Ingrese su correo electrónico"
          autocomplete="username"
          required
        >

      </div>


      <!-- CONTRASEÑA -->

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
          autocomplete="current-password"
          required
        >

      </div>


      <!-- MENSAJE DE ERROR -->

      @if (error) {

        <div class="login-error">
          {{ error }}
        </div>

      }


      <!-- BOTÓN -->

      <button
        type="submit"
        class="login-button"
      >
        Iniciar sesión
      </button>


    </form>

    

  </div>

</div>


<!-- =====================================================
     VENTANA: CORREO O CONTRASEÑA INCORRECTOS
     ===================================================== -->

@if (mostrarCredenciales) {

  <div class="modal-overlay" (click)="cerrarCredenciales()">

    <div
      class="modal-box"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="credenciales-titulo"
      aria-describedby="credenciales-mensaje"
      (click)="$event.stopPropagation()"
    >

      <div class="modal-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v4"></path>
          <path d="M12 16h.01"></path>
        </svg>
      </div>

      <h3 id="credenciales-titulo">Credenciales incorrectas</h3>

      <p id="credenciales-mensaje">
        El correo electrónico o la contraseña son incorrectos. Verifica tus datos e inténtalo nuevamente.
      </p>

      <button #btnEntendido type="button" class="modal-button" (click)="cerrarCredenciales()">
        Entendido
      </button>

    </div>

  </div>

}
