<div class="login-container">

  <!-- =====================================================
       LADO IZQUIERDO
       ===================================================== -->

  <div class="login-sidebar">

    <div class="sidebar-content">
      <h2></h2>
    </div>

  </div>


  <!-- =====================================================
       LADO DERECHO
       ===================================================== -->

  <div class="login-card">


    <!-- LOGO -->

    <div class="logo-container">

      <img
        src="https://cdn-icons-png.flaticon.com/512/284/284045.png"
        alt="Logo AI Secure Maturity"
        class="software-logo"
      >

    </div>


    <!-- TÍTULO -->

    <div class="login-header">
      <h1>AI - Secure Maturity</h1>
    </div>


    <!-- =================================================
         FORMULARIO
         ================================================= -->

    <form (ngSubmit)="iniciarSesion()">


      <!-- USUARIO -->

      <div class="form-group">

        <label for="usuario">
          Correo electrónico
        </label>

        <input
          id="usuario"
          name="usuario"
          type="text"
          [(ngModel)]="email"
          placeholder="Ingrese su correo electrónico"
          autocomplete="username"
          required
        >

      </div>


      <!-- CONTRASEÑA -->

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
          autocomplete="current-password"
          required
        >

      </div>


      <!-- BOTÓN -->

      <button
        type="submit"
        class="login-button"
        [disabled]="cargando"
      >
        {{ cargando ? 'Verificando...' : 'Iniciar sesión' }}
      </button>


    </form>

    

  </div>

</div>


<!-- =====================================================
     POP UP: INICIO DE SESIÓN FALLIDO
     ===================================================== -->

@if (mostrarError) {

  <div class="modal-overlay" (click)="cerrarError()">

    <div
      class="modal-box"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="login-error-titulo"
      aria-describedby="login-error-mensaje"
      (click)="$event.stopPropagation()"
    >

      <div class="modal-icon">
        <app-icon name="circle-alert" />
      </div>

      <h3 id="login-error-titulo">Inicio de sesión fallido</h3>
      <p id="login-error-mensaje">{{ error }}</p>

      <button type="button" class="modal-button" (click)="cerrarError()" autofocus>
        Aceptar
      </button>

    </div>

  </div>

}
