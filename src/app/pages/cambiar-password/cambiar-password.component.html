<main class="cp-page">
  <form class="cp-card" (ngSubmit)="actualizar()" novalidate>

    <div class="cp-icono"><app-icon name="shield-check" /></div>

    <h1>Cambia tu contraseña</h1>
    <p class="cp-sub">
      @if (nombre) { Hola, {{ nombre }}. }
      Por seguridad, debes reemplazar la contraseña asignada antes de continuar.
    </p>

    @if (mensajeValidacion || error) {
      <p class="cp-error" role="alert">{{ error || mensajeValidacion }}</p>
    }

    <label for="actual">Contraseña actual</label>
    <input id="actual" name="actual" type="password" autocomplete="current-password"
           [(ngModel)]="actual" [class.invalido]="errorActual">

    <label for="nueva">Nueva contraseña</label>
    <input id="nueva" name="nueva" type="password" autocomplete="new-password"
           [(ngModel)]="nueva" [class.invalido]="errorNueva">
    <small>Mínimo {{ MINIMO }} caracteres.</small>

    <label for="confirmar">Confirmar contraseña</label>
    <input id="confirmar" name="confirmar" type="password" autocomplete="new-password"
           [(ngModel)]="confirmar" [class.invalido]="errorConfirmar">

    <button type="submit" class="cp-btn" [disabled]="guardando">
      {{ guardando ? 'Actualizando...' : 'Actualizar y continuar' }}
    </button>

    <button type="button" class="cp-salir" (click)="salir()">Cerrar sesión</button>

  </form>
</main>
