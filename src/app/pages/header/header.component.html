<header class="top-header">

  <!-- IZQUIERDA -->

  <div class="header-left">

<!-- Marca -->
<div class="brand">
  <div class="brand-icon">
    <app-icon name="shield-check" />
  </div>

  <div class="brand-text">
    <span class="brand-title">IA Governance</span>
    <span class="brand-subtitle">Security Platform</span>
  </div>
</div>

<div class="header-divider"></div>

<!-- Inicio -->
<a routerLink="/menu"
   class="btn-home"
   title="Volver al menú principal" (click)="IrInicio()">

  <app-icon class="home-icon" name="home" />
  <span>Inicio</span>

</a>


  </div>

  <!-- DERECHA -->

  <div class="header-right">

<!-- Usuario -->
<div class="user-profile">

  <div class="avatar">
    {{ usuario()?.nombre?.charAt(0)?.toUpperCase() }}
  </div>

  <div class="user-details">

    <span class="user-name">
      {{ usuario()?.nombre }}
    </span>

    <span class="user-role">
      {{ rolLegible }}
    </span>

  </div>

</div>


<!-- Logout -->
<a routerLink="/login"
   class="btn-logout"
   title="Cerrar sesión" (click)="Logout()">

  <app-icon class="logout-icon" name="log-out" />
  <span>Salir</span>

</a>

  </div>

</header>
